<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ede0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dogdex" />
    <meta name="description" content="Dogdex: a collection game for the dogs you meet." />
    <title>Dogdex</title>

    <!-- Link previews (Slack, iMessage, Facebook, LinkedIn, X). __SITE_URL__ becomes VITE_SITE_URL at build time:
         previews need an absolute image address, so set it to your deployed URL (see .env.example). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dogdex" />
    <meta property="og:title" content="Dogdex: Gotta pet ’em all" />
    <meta property="og:description" content="A collection game for the dogs you meet. Log them, learn their breeds, and earn badges." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dogdex: Gotta pet ’em all. A dog silhouette on a cream card with a red-orange border." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dogdex: Gotta pet ’em all" />
    <meta name="twitter:description" content="A collection game for the dogs you meet. Log them, learn their breeds, and earn badges." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="Dogdex: Gotta pet ’em all. A dog silhouette on a cream card with a red-orange border." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
